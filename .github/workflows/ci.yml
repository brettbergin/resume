name: CI

# Pull-request gate for the site: lint, type-check, build, and (in the
# `responsive` job) the Playwright suite that checks layout at four widths.
# Deliberately separate from deploy-pages.yml, which publishes on pushes to
# main. Accessibility behaviour beyond that suite is still verified by hand.
#
# The trigger below is deliberately unfiltered: if this job is ever made a
# required status check, a `paths:` filter here would mean a PR touching
# none of those paths gets no run at all, and GitHub treats a required check
# that never reports as permanently pending rather than passing — the PR
# becomes unmergeable. So the job always runs and always reports a status;
# the "did this PR touch anything relevant" question is answered inside the
# job instead (see the `changes` step below), which gates the substantive
# steps but still lets the job complete quickly and green when nothing
# relevant changed.
on:
  pull_request:

# This job publishes nothing, so it asks for no more than reading the code.
# `pull-requests: read` is for the `changes` step below: dorny/paths-filter
# on a pull_request event with the default token calls the GitHub REST API
# to list the PR's changed files, which needs this scope explicitly — a
# `permissions:` block set at all turns off every unlisted scope rather than
# defaulting it, so without this line the API call is rejected with 403 and
# the job fails on every PR, not just out-of-scope ones.
permissions:
  contents: read
  pull-requests: read

# The opposite of the deploy workflow's queueing, for the opposite reason:
# a superseded push to a pull request has nothing half-published to protect,
# so cancel the outdated run instead of paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      # Same three patterns the old `on.pull_request.paths` filter used —
      # the build emits the repo-root PDF into dist/, so a pull request that
      # only regenerates the resume still needs the comparison step, and a
      # broken edit to this workflow needs to exercise itself too. Everything
      # below gates on this instead of the trigger.
      - name: Determine changed paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - site/**
              - resume.pdf
              - .github/workflows/ci.yml

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      - name: Test
        if: steps.changes.outputs.relevant == 'true'
        run: npm test

      # Three separate steps rather than one chained command: whichever one
      # fails, the check annotates the step that actually broke.
      # `--deny-warnings` because oxlint reports its default (correctness)
      # rules — no-debugger, no-unused-vars and the rest — at warning severity
      # and still exits 0, so the bare script would let them through the gate.
      # The flag lives here rather than in the script so a local `npm run lint`
      # stays advisory while the pull-request check is absolute.
      - name: Lint
        if: steps.changes.outputs.relevant == 'true'
        run: npm run lint -- --deny-warnings

      # `typecheck` is `tsc -b --noEmit`, so this reports type errors without
      # leaving build output behind for the build step to trip over.
      - name: Type-check
        if: steps.changes.outputs.relevant == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.changes.outputs.relevant == 'true'
        run: npm run build

      # The plugin that emits the PDF is only unit-tested, against stand-in
      # Vite objects — so this is the one place the *real* build output is
      # checked. A wrong or missing asset is a 404 behind the download button,
      # which nothing else in this job would notice.
      - name: Compare emitted PDF with the repo-root one
        if: steps.changes.outputs.relevant == 'true'
        run: cmp dist/resume.pdf ../resume.pdf

      # Vite content-hashes the entry bundle and base-prefixes its path, so a
      # broken base or an emptied dist/ would still leave index.html on disk —
      # only checking what it points at catches a page that 404s on load.
      - name: Assert dist/index.html references the built bundle
        if: steps.changes.outputs.relevant == 'true'
        run: test -f dist/index.html && grep -Eq '<script[^>]*type="module"[^>]*src="/resume/assets/index-[A-Za-z0-9_-]+\.js"' dist/index.html

  # Browser-backed check on the four widths test/layout-contract.test.ts's own
  # comment says jsdom cannot verify (see e2e/responsive.spec.ts). A separate
  # job rather than more `check` steps: it needs a browser install that the
  # other steps don't, and a failure here is about responsive layout, not
  # about lint/type/build, so it should annotate its own line in the PR's
  # checks rather than blur into `check`'s.
  responsive:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      # Same filter as `check`, so this job is also a fast no-op on a PR that
      # touches nothing relevant.
      - name: Determine changed paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - site/**
              - resume.pdf
              - .github/workflows/ci.yml

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      # Playwright's own browser binaries aren't part of the npm install, and
      # `--with-deps` also installs the system libraries Chromium needs on a
      # bare runner image.
      - name: Install Playwright browsers
        if: steps.changes.outputs.relevant == 'true'
        run: npx playwright install --with-deps chromium

      - name: Responsive e2e suite
        if: steps.changes.outputs.relevant == 'true'
        run: npm run test:e2e
