name: Deploy site to GitHub Pages

# Requires a one-time repo setting: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - site/**
      # The build emits the repo-root PDF into dist/, so a regenerated resume
      # would stay stale on Pages unless it triggers a deploy of its own.
      - resume.pdf
      # Changes to the workflow itself exercise the deploy too, so a broken
      # edit here surfaces on its own push instead of on the next site change.
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Overlapping pushes queue rather than race: cancelling a run mid-deploy can
# leave Pages serving a half-published artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` is `tsc -b && vite build`, so a type error fails here and the
      # deploy job never runs.
      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
