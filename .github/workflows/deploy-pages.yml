name: Deploy site to GitHub Pages

# Requires a one-time repo setting: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - site/**
      # The build emits the repo-root PDF into dist/, so a regenerated resume
      # would stay stale on Pages unless it triggers a deploy of its own.
      - resume.pdf
      # Changes to the workflow itself exercise the deploy too, so a broken
      # edit here surfaces on its own push instead of on the next site change.
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Overlapping pushes queue rather than race: cancelling a run mid-deploy can
# leave Pages serving a half-published artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` is `tsc -b && vite build`, so a type error fails here and the
      # deploy job never runs.
      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
